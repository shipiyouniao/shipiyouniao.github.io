name: Check and publish personal site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: personal-pages-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Check personal-site artifact boundaries
        run: |
          test -f dist/index.html
          test -f dist/Minesweeper-2.0/index.html
          test ! -e dist/minefarer
          test ! -e dist/CNAME
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-diagnostics
          path: |
            test-results/
            .preview/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        id: pages
      - name: Check account site destination
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: test -z "$PAGES_BASE_PATH"
      - uses: actions/deploy-pages@v4
        id: deployment
